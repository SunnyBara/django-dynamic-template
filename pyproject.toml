[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-dynamic-template"
version = "0.1.0"
description = "Django app for content-type–scoped dynamic templates with NamedID slugs"
readme = "README.md"
authors = [{ name = "Octolo", email = "dev@octolo.tech" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "Django>=3.2",
    # PyPI wheel may ship without modules; pin to VCS until releases are fixed.
    "django-namedid @ git+https://github.com/octolo/django-namedid.git",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.5",
    "django-virtualqueryset>=0.1.1",
    "django-boosted>=1.0.0",
    "django-richtextfield>=1.6",
    "ruff>=0.5",
    "mypy>=1.0",
    "django-stubs>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dynamic_template*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
plugins = ["mypy_django_plugin.main"]
mypy_path = "src"

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.ruff]
line-length = 100
target-version = "py310"
